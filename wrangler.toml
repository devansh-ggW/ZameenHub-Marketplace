name = "zameenhub-marketplace"
main = "worker/index.ts"
compatibility_date = "2026-10-28"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "zameenhub"
database_id = "771caa73-f1ec-4f51-b2f2-06b94fd3f5c1"
migrations_dir = "migrations"

[vars]
APP_URL = "https://zameenhub.dewify.shop"
RESEND_FROM_EMAIL = "ZameenHub <verify@zameenhub.dewify.shop>"
SUPPORT_EMAIL = "dewifystores@gmail.com"
