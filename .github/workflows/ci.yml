name: ZameenHub CI
on:
  push:
    branches: ["main", "feat/production-auth-upgrade", "feat/security-mfa-ai-hardening", "engineering/**", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
        with:
          version: 10.12.4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit
      - run: python3 scripts/check-migrations.py
      - run: node --experimental-strip-types scripts/test-totp.mjs
      - run: node --experimental-strip-types scripts/test-emi.mjs
      - run: node --experimental-strip-types scripts/test-community-trust.mjs
      - run: pnpm build
      - run: pnpm test:smoke
      - run: pnpm dlx wrangler@4.154.0 deploy --dry-run
